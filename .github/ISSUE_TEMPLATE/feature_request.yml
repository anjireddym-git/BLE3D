name: Feature request
description: Propose a focused BLE3D improvement
title: "[Feature]: "
labels: [enhancement, needs-discussion]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should BLE3D solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the interaction, behavior, or technical direction.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: accuracy
    attributes:
      label: Accuracy and privacy impact
      description: Could this change affect ranging claims, identity inference, device connections, local storage, or network access?
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I may be able to implement or test this feature.
        - label: I can provide Windows or Linux hardware validation.
