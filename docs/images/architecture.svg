<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">BLE3D architecture</title>
  <desc id="desc">BLE advertisements flow through the Rust scanner, filtering and ranging, then into SQLite history and the React 3D interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071014"/><stop offset="1" stop-color="#102830"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#6fffe9"/><stop offset="1" stop-color="#52c8ff"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6Z" fill="#6fb8be"/></marker>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <text x="60" y="62" fill="#e9fbfc" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="650">How a signal becomes a marker</text>
  <text x="60" y="88" fill="#78999e" font-family="Inter,Segoe UI,sans-serif" font-size="12">A local-only pipeline. No peripheral connections, cloud services, or telemetry.</text>

  <g font-family="Inter,Segoe UI,sans-serif">
    <g transform="translate(60 142)"><rect width="200" height="150" rx="14" fill="#0d2228" stroke="#75dde4" stroke-opacity=".2"/><circle cx="36" cy="38" r="17" fill="#6fffe9" fill-opacity=".08" stroke="#6fffe9"/><path d="M36 26v24l10-8-10-4 10-5-10-7Zm0 12-9-6m9 6-9 7" fill="none" stroke="#6fffe9" stroke-width="2"/><text x="64" y="34" fill="#e3f4f5" font-size="14" font-weight="650">BLE advertisements</text><text x="64" y="54" fill="#688a90" font-size="9">PASSIVE INPUT</text><text x="22" y="91" fill="#9bb5b9" font-size="11">Name · RSSI · TX power</text><text x="22" y="112" fill="#9bb5b9" font-size="11">Services · manufacturer data</text><text x="22" y="133" fill="#9bb5b9" font-size="11">Opaque platform identifier</text></g>
    <path d="M270 217h62" stroke="#6fb8be" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(344 142)"><rect width="230" height="150" rx="14" fill="#0d2228" stroke="#75dde4" stroke-opacity=".2"/><circle cx="37" cy="38" r="17" fill="#52c8ff" fill-opacity=".08" stroke="#52c8ff"/><path d="m29 39 5 5 11-13" fill="none" stroke="#75dcff" stroke-width="2"/><text x="64" y="34" fill="#e3f4f5" font-size="14" font-weight="650">Rust signal engine</text><text x="64" y="54" fill="#688a90" font-size="9">BTLEPLUG + TAURI</text><text x="22" y="91" fill="#9bb5b9" font-size="11">Rolling median + EMA</text><text x="22" y="112" fill="#9bb5b9" font-size="11">Path-loss ranging + calibration</text><text x="22" y="133" fill="#9bb5b9" font-size="11">Uncertainty + identity evidence</text></g>
    <path d="M584 217h62" stroke="#6fb8be" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(658 142)"><rect width="210" height="150" rx="14" fill="#0d2228" stroke="#75dde4" stroke-opacity=".2"/><circle cx="37" cy="38" r="17" fill="#ffca71" fill-opacity=".07" stroke="#ffca71"/><path d="M28 31h18v15H28zm3-5h12v5" fill="none" stroke="#ffca71" stroke-width="2"/><text x="64" y="34" fill="#e3f4f5" font-size="14" font-weight="650">Local state</text><text x="64" y="54" fill="#688a90" font-size="9">MEMORY + SQLITE</text><text x="22" y="91" fill="#9bb5b9" font-size="11">Live device snapshots</text><text x="22" y="112" fill="#9bb5b9" font-size="11">10-second history buckets</text><text x="22" y="133" fill="#9bb5b9" font-size="11">Settings and calibrations</text></g>
    <path d="M878 217h62" stroke="#6fb8be" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(952 142)"><rect width="188" height="150" rx="14" fill="#0d2228" stroke="#6fffe9" stroke-opacity=".32"/><circle cx="37" cy="38" r="17" fill="#6fffe9" fill-opacity=".08" stroke="#6fffe9"/><circle cx="37" cy="38" r="4" fill="#efffff"/><circle cx="37" cy="38" r="11" fill="none" stroke="#6fffe9" opacity=".5"/><text x="64" y="34" fill="#e3f4f5" font-size="14" font-weight="650">React interface</text><text x="64" y="54" fill="#688a90" font-size="9">R3F + THREE.JS</text><text x="22" y="91" fill="#9bb5b9" font-size="11">3D proximity scene</text><text x="22" y="112" fill="#9bb5b9" font-size="11">Accessible device list</text><text x="22" y="133" fill="#9bb5b9" font-size="11">Filters, details, history</text></g>
  </g>
  <g transform="translate(60 348)" font-family="Inter,Segoe UI,sans-serif"><rect width="1080" height="92" rx="12" fill="#061217" stroke="#7cbec4" stroke-opacity=".11"/><text x="24" y="31" fill="#6fffe9" font-size="10" font-weight="800" letter-spacing="1.5">TRUST BOUNDARY</text><text x="24" y="57" fill="#a9c1c4" font-size="12">Everything stays on the computer running BLE3D. The scanner never initiates a GATT connection.</text><text x="24" y="76" fill="#67868b" font-size="10">Angles are deterministic visual placement; only the radial RSSI estimate is measured.</text></g>
</svg>
